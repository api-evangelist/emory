---
aid: emory
name: Emory University
description: >-
  Emory University is a private research university in Atlanta, Georgia, and a member of the
  Association of American Universities. Its programmable footprint is small, federated across
  units, and — as of the 2026-09-01 re-profile — partly retired. Emory operates no central
  developer portal and no public course, campus or open-data API. The surfaces it genuinely runs
  itself are: a Shibboleth/SAML identity provider at login.emory.edu, registered in InCommon and
  reachable through eduGAIN, which is the strongest machine-readable thing the institution
  publishes; two Emory Libraries applications built on the division's own open-source Rails code
  (a Blacklight JSON:API search endpoint at digital.library.emory.edu and a Samvera Hyrax
  repository at open.library.emory.edu that exposes a ResourceSync capability list); and a large
  public GitHub organization, emory-libraries, holding the Hyrax/Samvera software those systems
  run on. The Girder-based Digital Slide Archive REST API at computablebrain.emory.edu was
  Emory-operated and is the source of the 22 OpenAPI contracts held here, but the host now serves
  a stock nginx page and refuses TLS; those contracts are kept as a retired, correctly attributed
  Emory surface. Everything else that looks like an Emory API is a tenancy: Canvas on Instructure,
  library discovery on Ex Libris Primo, and the Course Atlas catalog on CourseLeaf.
type: Index
