x-coverage:
  state: covered
  reason: covered
  detail: >-
    Emory operates a small but real set of institution-run surfaces and they are all recorded:
    a self-hosted Shibboleth/SAML IdP registered in InCommon (the strongest thing it publishes),
    a live Blacklight JSON:API search endpoint at digital.library.emory.edu, a Samvera Hyrax
    repository publishing a ResourceSync capability list at open.library.emory.edu, and the
    emory-libraries GitHub organization holding the code both run on. The 22 Girder / Digital
    Slide Archive contracts in this repo were genuinely Emory-operated and are correctly
    attributed, but the host was retired between the 2026-06-03 profile and this one — TLS
    refused, stock nginx page on port 80 — so they are marked x-status: retired and their dead
    documentation pointers were removed. Four surfaces that a hostname-based verdict would have
    credited to Emory are tenancies and are recorded as such rather than deleted: Canvas
    (CNAME to emory-vanity.instructure.com), Course Atlas (CNAME to emory-fs.courseleaf.com),
    library discovery (redirect to emory.primo.exlibrisgroup.com), and ROR/InCommon which are a
    registry membership and a federation registration. There is no central developer portal, no
    api.emory.edu, no data.emory.edu, no OAI-PMH responder, no llms.txt and no security.txt; that
    absence is a measurement, not a gap in this pass.
