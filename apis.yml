apis:
  - aid: emory:digital-slide-archive
    name: Emory Digital Slide Archive REST API
    description: >-
      Public REST API for the Emory Digital Slide Archive (computablebrain),
      a Girder/HistomicsTK-based platform for digital pathology and
      whole-slide imaging. The API exposes documented resource endpoints for
      systems, items, files, folders and annotations, with a live Swagger
      interface at /api/v1.
    humanURL: https://computablebrain.emory.edu/api/v1
    baseURL: https://computablebrain.emory.edu/api/v1
    tags: [ Research, Imaging, Pathology, REST ]
    properties:
      - type: Documentation
        url: https://computablebrain.emory.edu/api/v1
  - aid: emory:canvas-lms
    name: Emory Canvas LMS REST API
    description: >-
      Emory's instance of the Instructure Canvas learning management system
      exposes the standard Canvas LMS REST API. Access requires an Emory
      Canvas account and developer keys / API access tokens; the reference
      documentation is mirrored at the institution's Canvas host.
    humanURL: https://canvas.emory.edu/doc/api/
    tags: [ Education, LMS, REST ]
    properties:
      - type: Documentation
        url: https://canvas.emory.edu/doc/api/
      - type: Authentication
        url: https://canvas.emory.edu/doc/api/developer_keys.html
  - aid: emory:shibboleth
    name: Emory Identity (Shibboleth / SAML)
    description: >-
      Emory operates a federated Shibboleth identity provider for SAML-based
      single sign-on across institutional and partner services
      (InCommon federation). The IdP metadata endpoint is publicly reachable;
      authentication itself is gated to Emory credential holders.
    humanURL: https://login.emory.edu/
    baseURL: https://login.emory.edu/idp/shibboleth
    tags: [ Identity, Authentication, SAML, Shibboleth, SSO ]
    properties:
      - type: Documentation
        url: https://login.emory.edu/
  - aid: emory:libraries-github
    name: Emory Libraries Digital Repository Software
    description: >-
      Emory Libraries (Library Technology and Digital Strategies) maintains a
      large public open-source GitHub organization with ~120 repositories,
      including the dlp-curate preservation workbench, TheKeep archival
      curation app, dlp-lux discovery layer, and a Samvera/Hyrax fork. These
      Ruby on Rails / Hyrax applications underpin the OpenEmory and Digital
      Library Program repositories and their associated repository APIs.
    humanURL: https://github.com/emory-libraries
    tags: [ Libraries, Open Source, Digital Repository, Hyrax, Samvera ]
    properties:
      - type: Documentation
        url: https://emory-libraries.github.io/
      - type: GitHub
        url: https://github.com/emory-libraries
