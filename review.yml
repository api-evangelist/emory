reviews:
  - date: '2026-06-03'
    rating: 2
    summary: >-
      Emory has no central, self-service developer portal. The confirmed public
      programmatic surfaces are a live Digital Slide Archive REST API
      (computablebrain, Girder/Swagger, returned a 200 from /api/v1 and
      /api/v1/system/version), the Instructure Canvas LMS REST API mirrored at
      the Emory Canvas host (gated by account + developer keys), a federated
      Shibboleth/SAML identity provider (login.emory.edu, IdP metadata
      reachable), and the active emory-libraries GitHub org (120 public repos of
      Samvera/Hyrax digital-repository software). Institutional systems such as
      OPUS and Course Atlas are gated browser apps with no documented public
      API. The EmoryUniversity GitHub org exists but has 0 public repos, so the
      libraries org was cataloged instead. No endpoints were fabricated; all
      statuses below were probed live.
    endpoints:
      - url: https://www.emory.edu/
        status: 200
        note: Official institutional website.
      - url: https://computablebrain.emory.edu/api/v1
        status: 200
        note: Digital Slide Archive REST API root with live Swagger docs.
      - url: https://computablebrain.emory.edu/api/v1/system/version
