      - name: stain_2_vector
        in: query
        required: false
        description: Custom value for stain-2 as JSON (double-vector)
        schema:
          type: string
          default: '[-1.0, -1.0, -1.0]'
      - name: stain_3
        in: query
        required: false
        description: Name of stain-3
        schema:
          type: string
          enum:
          - hematoxylin
          - eosin
          - dab
          - 'null'
          - custom
          default: 'null'
      - name: stain_3_vector
        in: query
        required: false
        description: Custom value for stain-3 as JSON (double-vector)
        schema:
          type: string
          default: '[-1.0, -1.0, -1.0]'
