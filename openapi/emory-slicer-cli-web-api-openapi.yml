      - name: tile_overlap_value
        in: query
        required: false
        description: Tile overlap size in pixels, Default value of -1 indicate that the tile overlap will be set to (max_radius + 1) * 4
        schema:
          type: integer
          format: int32
          default: -1
      responses:
        '200':
