        in: query
        required: false
        description: Optional format parameters, such as "encoding=JPEG&jpegQuality=85&jpegSubsampling=1".  If specified,
          these replace the defaults.
        schema:
          type: string
      - name: query
        in: query
        required: false
        description: Addition query parameters that would be passed to tile endpoints, such as style.
        schema:
          type: string
      - name: frameBase
        in: query
        required: false
        description: Starting frame number (default 0).  If c/z/t/xy then step through values from 0 to number of that axis
          - 1.  The axis specification in only useful for cache reporting or scheduling
        schema:
          type: integer
          format: int32
      - name: frameStride
        in: query
        required: false
        description: Only use every frameStride frame of the image (default 1).  c/z/t/xy to use the length of that axis
        schema:
          type: integer
          format: int32
      - name: frameGroup
        in: query
        required: false
        description: Group frames when using multiple textures to keep boundaries at a multiple of the group size number.  c/z/t/xy
          to use the length of that axis.
        schema:
          type: integer
          format: int32
      - name: frameGroupFactor
        in: query
        required: false
        description: Ignore grouping if the resultant images would be more than this factor smaller than without grouping
          (default 4)
        schema:
          type: integer
          format: int32
      - name: frameGroupStride
        in: query
        required: false
        description: Reorder frames based on the to stride (default 1).  "auto" to use frameGroup / frameStride if that value
          is an integer.
        schema:
          type: integer
          format: int32
      - name: maxTextureSize
        in: query
        required: false
        description: Maximum texture size in either dimension.  This should be the smaller of a desired value and of the intended
          graphics environment texture buffer (default 16384).
        schema:
          type: integer
          format: int32
      - name: maxTextures
        in: query
        required: false
        description: Maximum number of textures to use (default 1).
        schema:
          type: integer
          format: int32
      - name: maxTotalTexturePixels
        in: query
        required: false
        description: Limit the total area of all combined textures (default 2**30).
        schema:
          type: integer
          format: int32
      - name: alignment
        in: query
        required: false
        description: Individual frame alignment within a texture.  Used to avoid jpeg artifacts from crossing frames (default
          16).
        schema:
          type: integer
          format: int32
      - name: maxFrameSize
        in: query
        required: false
        description: If specified, frames will never be larger than this, even if the texture size allows it (default None).
        schema:
          type: integer
          format: int32
      - name: cache
        in: query
        required: false
        description: Report on or request caching the resultant frames.  Scheduling creates a local job.
        schema:
          type: string
          enum:
          - none
          - report
          - schedule
      responses:
        '200':
          description: Success
        '400':
          description: ID was invalid.
        '403':
          description: Read access was denied for the item.
      summary: Get parameters for using tile_frames as background sprite images.
      tags:
      - item
