  /item/{itemId}/tiles/region:
    get:
      description: If neither width nor height is specified, the full resolution region is returned.  If a width or height
        is specified, aspect ratio is always preserved (if both are given, the resulting image may be smaller in one of the
        two dimensions).  When scaling must be applied, the image is downsampled from a higher resolution layer, never upsampled.
      operationId: item_getTilesRegion_itemId_tiles_region
      parameters:
      - name: itemId
        in: path
        required: true
        description: The ID of the item.
        schema:
          type: string
      - name: left
        in: query
        required: false
        description: The left column (0-based) of the region to process.  Negative values are offsets from the right edge.
        schema:
          type: number
          format: float
      - name: top
        in: query
        required: false
        description: The top row (0-based) of the region to process.  Negative values are offsets from the bottom edge.
        schema:
          type: number
          format: float
      - name: right
        in: query
        required: false
        description: The right column (0-based from the left) of the region to process.  The region will not include this
          column.  Negative values are offsets from the right edge.
        schema:
          type: number
          format: float
      - name: bottom
        in: query
        required: false
        description: The bottom row (0-based from the top) of the region to process.  The region will not include this row.  Negative
          values are offsets from the bottom edge.
        schema:
          type: number
          format: float
      - name: regionWidth
        in: query
        required: false
        description: The width of the region to process.
        schema:
          type: number
          format: float
      - name: regionHeight
        in: query
        required: false
        description: The height of the region to process.
        schema:
          type: number
          format: float
      - name: units
        in: query
        required: false
        description: Units used for left, top, right, bottom, regionWidth, and regionHeight.  base_pixels are pixels at the
          maximum resolution, pixels and mm are at the specified magnfication, fraction is a scale of [0-1].
        schema:
          type: string
          enum:
          - base_pixels
          - fraction
          - km
          - m
          - mag_pixels
          - mm
          - nm
          - proj4:EPSG:4326
          - projection
          - um
          default: base_pixels
      - name: width
        in: query
        required: false
        description: The maximum width of the output image in pixels.
        schema:
          type: integer
          format: int32
      - name: height
        in: query
        required: false
        description: The maximum height of the output image in pixels.
        schema:
          type: integer
          format: int32
      - name: fill
        in: query
        required: false
        description: A fill color.  If output dimensions are specified and fill is specified and not "none", the output image
          is padded on either the sides or the top and bottom to the requested output size.  Most css colors are accepted.
        schema:
          type: string
      - name: magnification
        in: query
        required: false
        description: Magnification of the output image.  If neither width for height is specified, the magnification, mm_x,
          and mm_y parameters are used to select the output size.
        schema:
          type: number
          format: float
      - name: mm_x
        in: query
        required: false
        description: The size of the output pixels in millimeters
        schema:
          type: number
          format: float
      - name: mm_y
        in: query
        required: false
        description: The size of the output pixels in millimeters
        schema:
          type: number
          format: float
      - name: exact
        in: query
        required: false
        description: If magnification, mm_x, or mm_y are specified, they must match an existing level of the image exactly.
        schema:
          type: boolean
          default: false
      - name: frame
        in: query
        required: false
        description: For multiframe images, the 0-based frame number.  This is ignored on non-multiframe images.
        schema:
          type: integer
          format: int32
      - name: encoding
        in: query
        required: false
        description: Output image encoding.  TILED generates a tiled tiff without the upper limit on image size the other
          options have.  For geospatial sources, TILED will also have appropriate tagging.  Pickle emits python pickle data
          with an optional specific protocol
        schema:
          type: string
          enum:
          - JPEG
          - PNG
          - TIFF
          - TILED
          - JFIF
          - AVIF
          - BMP
          - DIB
          - PCX
          - EPS
          - GIF
          - JPEG2000
          - MPO
          - PPM
          - SGI
          - TGA
          - WEBP
          - XBM
          - pickle
          - pickle:3
          - pickle:4
          - pickle:5
          default: JPEG
      - name: jpegQuality
        in: query
        required: false
        description: Quality used for generating JPEG images
        schema:
          type: integer
          format: int32
          default: 95
      - name: jpegSubsampling
        in: query
        required: false
        description: Chroma subsampling used for generating JPEG images.  0, 1, and 2 are full, half, and quarter resolution
          chroma respectively.
        schema:
          type: integer
          format: int32
          enum:
          - '0'
          - '1'
          - '2'
          default: '0'
      - name: tiffCompression
        in: query
        required: false
        description: Compression method when storing a TIFF image
        schema:
          type: string
          enum:
          - none
          - raw
          - lzw
          - tiff_lzw
          - jpeg
          - deflate
          - tiff_adobe_deflate
      - name: style
        in: query
        required: false
        description: JSON-encoded style string
        schema:
          type: string
      - name: resample
        in: query
        required: false
        description: If false, an existing level of the image is used for the region.  If true, the internal values are interpolated
          to match the specified size as needed.  0-3 for a specific interpolation method (0-nearest, 1-lanczos, 2-bilinear,
          3-bicubic)
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
          - '0'
          - '1'
          - '2'
          - '3'
      - name: contentDisposition
        in: query
        required: false
        description: Specify the Content-Disposition response header disposition-type value.
        schema:
          type: string
          enum:
          - inline
          - attachment
      - name: contentDispositionFilename
        in: query
        required: false
        description: Specify the filename used in the Content-Disposition response header.
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: 'ID was invalid.


            Insufficient memory.'
        '403':
          description: Read access was denied for the item.
      summary: Get any region of a large image item, optionally scaling it.
      tags:
      - item
