        in: query
        required: false
        description: Custom value for stain-1 as JSON (double-vector)
        schema:
          type: string
      - name: stain_2
        in: query
        required: false
        description: Name of stain-2
        schema:
          type: string
          enum:
          - hematoxylin
          - eosin
          - dab
          - custom
      - name: stain_2_vector
        in: query
        required: false
        description: Custom value for stain-2 as JSON (double-vector)
        schema:
          type: string
      - name: stain_3
        in: query
        required: false
        description: Name of stain-3
        schema:
          type: string
          enum:
          - hematoxylin
          - eosin
          - dab
          - 'null'
          - custom
      - name: stain_3_vector
        in: query
        required: false
        description: Custom value for stain-3 as JSON (double-vector)
        schema:
          type: string
      - name: style
        in: query
        required: false
        description: Image style options for compositing a multi-frame image
        schema:
          type: string
      - name: tile_overlap_value
        in: query
        required: false
        description: Tile overlap size in pixels, Default value of -1 indicate that the tile overlap will be set to (max_radius
          + 1) * 4
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
        '400':
          description: A parameter was invalid.
      summary: Rerun Detects Nuclei
      tags:
      - slicer_cli_web
