          - float
          - 'yes'
      - name: psnr
        in: query
        required: false
        description: JP2K compression target peak-signal-to-noise-ratio where 0 is lossless and otherwise higher numbers are
          higher quality
        schema:
          type: integer
          format: int32
      - name: cr
        in: query
        required: false
        description: JP2K target compression ratio where 1 is lossless
        schema:
          type: integer
          format: int32
      - name: concurrent
        in: query
        required: false
        description: Suggested number of maximum concurrent processes to use during conversion.  Values less than or equal
          to 0 use the number of logical cpus less that value.  Default is -2.
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
        '400':
          description: A parameter was invalid.
