  /slicer_cli_web/dsarchive_histomicstk_latest/SuperpixelSegmentation/rerun:
    post:
      description: 'Rerun a previous job: Description: <br/><br/>Create a pixelmap image of superpixels using SLIC.<br/><br/>Version:
        0.1.0<br/><br/>License: Apache 2.0<br/><br/>Author(s): Kitware<br/><br/>Acknowledgements: This work is part of the
        HistomicsTK project.'
      operationId: slicer_cli_web_rerunHandler_post_dsarchive_histomicstk_latest_SuperpixelSegmentation_rerun
      parameters:
      - name: jobId
        in: query
        required: true
        description: The previous job ID
        schema:
          type: string
      - name: inputImageFile
        in: query
        required: false
        description: 'Girder ID of input image (if batch input, this is a regex for item names) - inputImageFile: Input image
          for superpixel segmentation'
        schema:
          type: string
      - name: inputImageFile_folder
        in: query
        required: false
        description: 'Girder ID of parent folder for batch input image - inputImageFile: Input image for superpixel segmentation'
        schema:
          type: string
      - name: outputImageFile_folder
        in: query
        required: false
        description: 'Girder ID of parent folder for output image - outputImageFile: Output Image of Superpixel Pixelmap (*.tiff)'
        schema:
          type: string
      - name: outputImageFile
        in: query
        required: false
        description: 'Name of output image - outputImageFile: Output Image of Superpixel Pixelmap (*.tiff)'
        schema:
          type: string
      - name: boundaries
        in: query
        required: false
        description: Mark the boundary around each superpixel. Boundaries are specified with a separate pixelmap index value
          that is always 1 higher than the pixelmap index value of the superpixel's interior.
        schema:
          type: boolean
      - name: bounding
        in: query
        required: false
        description: If specified, output an annotation with the bounding box of each superpixel.  Internal adds a user.bbox
          field as a single array to the superpixel annotation with the base image coordinates left,top,right,bottom for each
          superpixel.
        schema:
          type: string
          enum:
          - None
          - Separate
          - Internal
          - All
      - name: compactness
        in: query
        required: false
        description: Balances color proximity and space proximity. Higher values give more weight to space proximity, making
          superpixel shapes more square/cubic.
        schema:
          type: number
          format: float
      - name: default_category_label
        in: query
        required: false
        description: Default category label used for superpixels
        schema:
          type: string
      - name: default_fillColor
        in: query
        required: false
        description: Default color for superpixels
        schema:
          type: string
      - name: default_strokeColor
        in: query
        required: false
        description: If creating boundary superpixels, this is the default color of the boundaries of the superpixels
        schema:
          type: string
      - name: magnification
        in: query
        required: false
        description: If specified, the magnification that should be used for the superpixels.  If 0, the base magnfication
          is used
        schema:
          type: number
          format: float
      - name: overlap
        in: query
        required: false
        description: If specified, overlap tile computation to avoid edge effects.
        schema:
          type: boolean
      - name: roi
        in: query
        required: false
        description: Region of interest within which the analysis should be run as JSON (region)
        schema:
          type: string
      - name: sigma
        in: query
        required: false
        description: Width of Gaussian smoothing kernel for pre-processing for each dimension of the image. The same sigma
          is applied to each dimension in case of a scalar value. Zero means no smoothing.
        schema:
          type: number
          format: float
      - name: slic_zero
        in: query
        required: false
        description: If true, run the algorithm in SLIC0 mode to adaptively determine compactness for each superpixel.
        schema:
          type: boolean
      - name: superpixelSize
        in: query
        required: false
        description: Approximate diameter of the average superpixel.
        schema:
          type: integer
          format: int32
      - name: outputAnnotationFile_folder
        in: query
        required: false
        description: 'Girder ID of parent folder for output file - outputAnnotationFile: Annotation to display pixelmap on
          source (*.anot)'
        schema:
          type: string
      - name: outputAnnotationFile
        in: query
        required: false
        description: 'Name of output file - outputAnnotationFile: Annotation to display pixelmap on source (*.anot)'
        schema:
          type: string
      - name: tileSize
        in: query
        required: false
        description: Specify the size of the working tile. If there is no overlap, superpixel boundaries will appear at these
          locations.
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
        '400':
          description: A parameter was invalid.
      summary: Rerun Superpixel Pixelmap
      tags:
      - slicer_cli_web
