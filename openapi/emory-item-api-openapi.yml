  /item/{itemId}/tiles/tile_frames:
    get:
      operationId: item_tileFrames_itemId_tiles_tile_frames
      parameters:
      - name: itemId
        in: path
        required: true
        description: The ID of the item.
        schema:
          type: string
      - name: framesAcross
        in: query
        required: false
        description: How many frames across
        schema:
          type: integer
          format: int32
      - name: frameList
        in: query
        required: false
        description: Comma-separated list of frames
        schema:
          type: string
      - name: cache
        in: query
        required: false
        description: Cache the results for future use
        schema:
          type: boolean
          default: false
      - name: left
        in: query
        required: false
        description: The left column (0-based) of the region to process.  Negative values are offsets from the right edge.
        schema:
          type: number
          format: float
      - name: top
        in: query
        required: false
        description: The top row (0-based) of the region to process.  Negative values are offsets from the bottom edge.
        schema:
          type: number
          format: float
      - name: right
        in: query
        required: false
        description: The right column (0-based from the left) of the region to process.  The region will not include this column.  Negative values are offsets from the right edge.
        schema:
          type: number
          format: float
      - name: bottom
        in: query
        required: false
        description: The bottom row (0-based from the top) of the region to process.  The region will not include this row.  Negative values are offsets from the bottom edge.
        schema:
          type: number
          format: float
      - name: regionWidth
        in: query
        required: false
        description: The width of the region to process.
        schema:
          type: number
          format: float
      - name: regionHeight
        in: query
        required: false
        description: The height of the region to process.
        schema:
          type: number
          format: float
      - name: units
        in: query
        required: false
        description: Units used for left, top, right, bottom, regionWidth, and regionHeight.  base_pixels are pixels at the maximum resolution, pixels and mm are at the specified magnfication, fraction is a scale of [0-1].
        schema:
          type: string
          enum:
          - base_pixels
          - fraction
          - km
          - m
          - mag_pixels
          - mm
          - nm
          - proj4:EPSG:4326
          - projection
          - um
          default: base_pixels
      - name: width
        in: query
        required: false
        description: The maximum width of the output image in pixels.
        schema:
          type: integer
          format: int32
      - name: height
        in: query
        required: false
        description: The maximum height of the output image in pixels.
        schema:
          type: integer
          format: int32
      - name: fill
        in: query
        required: false
        description: A fill color.  If output dimensions are specified and fill is specified and not "none", the output image is padded on either the sides or the top and bottom to the requested output size.  Most css colors are accepted.
        schema:
          type: string
      - name: magnification
        in: query
        required: false
        description: Magnification of the output image.  If neither width for height is specified, the magnification, mm_x, and mm_y parameters are used to select the output size.
        schema:
          type: number
          format: float
      - name: mm_x
        in: query
        required: false
        description: The size of the output pixels in millimeters
        schema:
          type: number
          format: float
      - name: mm_y
        in: query
        required: false
        description: The size of the output pixels in millimeters
        schema:
          type: number
          format: float
      - name: exact
        in: query
        required: false
        description: If magnification, mm_x, or mm_y are specified, they must match an existing level of the image exactly.
        schema:
          type: boolean
          default: false
      - name: frame
        in: query
        required: false
        description: For multiframe images, the 0-based frame number.  This is ignored on non-multiframe images.
        schema:
          type: integer
          format: int32
      - name: encoding
        in: query
        required: false
        description: Output image encoding.  TILED generates a tiled tiff without the upper limit on image size the other options have.  For geospatial sources, TILED will also have appropriate tagging.  Pickle emits python pickle data with an optional specific protocol
        schema:
          type: string
          enum:
          - JPEG
          - PNG
          - TIFF
          - TILED
          - JFIF
          - AVIF
          - BMP
          - DIB
          - PCX
          - EPS
          - GIF
          - JPEG2000
          - MPO
          - PPM
          - SGI
          - TGA
          - WEBP
          - XBM
          - pickle
          - pickle:3
          - pickle:4
          - pickle:5
          default: JPEG
      - name: jpegQuality
        in: query
        required: false
        description: Quality used for generating JPEG images
        schema:
          type: integer
          format: int32
          default: 95
      - name: jpegSubsampling
        in: query
        required: false
        description: Chroma subsampling used for generating JPEG images.  0, 1, and 2 are full, half, and quarter resolution chroma respectively.
        schema:
          type: integer
          format: int32
          enum:
          - '0'
          - '1'
          - '2'
          default: '0'
      - name: tiffCompression
        in: query
        required: false
        description: Compression method when storing a TIFF image
        schema:
          type: string
          enum:
          - none
          - raw
          - lzw
          - tiff_lzw
          - jpeg
          - deflate
          - tiff_adobe_deflate
      - name: style
        in: query
        required: false
        description: JSON-encoded style string
        schema:
          type: string
      - name: resample
        in: query
        required: false
        description: If false, an existing level of the image is used for the region.  If true, the internal values are interpolated to match the specified size as needed.  0-3 for a specific interpolation method (0-nearest, 1-lanczos, 2-bilinear, 3-bicubic)
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
          - '0'
          - '1'
          - '2'
          - '3'
      - name: contentDisposition
        in: query
        required: false
        description: Specify the Content-Disposition response header disposition-type value.
        schema:
          type: string
          enum:
          - inline
          - attachment
      - name: contentDispositionFilename
        in: query
        required: false
        description: Specify the filename used in the Content-Disposition response header.
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: 'ID was invalid.


            Insufficient memory.'
        '403':
          description: Read access was denied for the item.
      summary: Composite thumbnails of multiple frames into a single image.
      tags:
      - item
  /item/{itemId}/tiles/tile_frames/quad_info:
    get:
      operationId: item_tileFramesQuadInfo_itemId_tiles_tile_frames_quad_info
      parameters:
      - name: itemId
        in: path
        required: true
        description: The ID of the item.
        schema:
          type: string
      - name: format
        in: query
        required: false
        description: Optional format parameters, such as "encoding=JPEG&jpegQuality=85&jpegSubsampling=1".  If specified, these replace the defaults.
        schema:
          type: string
      - name: query
        in: query
        required: false
        description: Addition query parameters that would be passed to tile endpoints, such as style.
        schema:
          type: string
      - name: frameBase
        in: query
        required: false
        description: Starting frame number (default 0).  If c/z/t/xy then step through values from 0 to number of that axis - 1.  The axis specification in only useful for cache reporting or scheduling
        schema:
          type: integer
          format: int32
      - name: frameStride
        in: query
        required: false
        description: Only use every frameStride frame of the image (default 1).  c/z/t/xy to use the length of that axis
        schema:
          type: integer
          format: int32
      - name: frameGroup
        in: query
        required: false
        description: Group frames when using multiple textures to keep boundaries at a multiple of the group size number.  c/z/t/xy to use the length of that axis.
        schema:
          type: integer
          format: int32
      - name: frameGroupFactor
        in: query
        required: false
        description: Ignore grouping if the resultant images would be more than this factor smaller than without grouping (default 4)
        schema:
          type: integer
          format: int32
      - name: frameGroupStride
        in: query
        required: false
        description: Reorder frames based on the to stride (default 1).  "auto" to use frameGroup / frameStride if that value is an integer.
        schema:
          type: integer
          format: int32
      - name: maxTextureSize
        in: query
        required: false
        description: Maximum texture size in either dimension.  This should be the smaller of a desired value and of the intended graphics environment texture buffer (default 16384).
        schema:
          type: integer
          format: int32
      - name: maxTextures
        in: query
        required: false
        description: Maximum number of textures to use (default 1).
        schema:
          type: integer
          format: int32
      - name: maxTotalTexturePixels
        in: query
        required: false
        description: Limit the total area of all combined textures (default 2**30).
        schema:
          type: integer
          format: int32
      - name: alignment
        in: query
        required: false
        description: Individual frame alignment within a texture.  Used to avoid jpeg artifacts from crossing frames (default 16).
        schema:
          type: integer
          format: int32
      - name: maxFrameSize
        in: query
        required: false
        description: If specified, frames will never be larger than this, even if the texture size allows it (default None).
        schema:
          type: integer
          format: int32
      - name: cache
        in: query
        required: false
        description: Report on or request caching the resultant frames.  Scheduling creates a local job.
        schema:
          type: string
          enum:
          - none
          - report
          - schedule
      responses:
        '200':
          description: Success
        '400':
          description: ID was invalid.
        '403':
          description: Read access was denied for the item.
      summary: Get parameters for using tile_frames as background sprite images.
      tags:
      - item
  /item/{itemId}/tiles/zxy/{z}/{x}/{y}:
    get:
      operationId: item_getTile_itemId_tiles_zxy_z_x_y
      parameters:
      - name: itemId
        in: path
        required: true
        description: The ID of the item.
        schema:
          type: string
      - name: z
        in: path
        required: true
        description: The layer number of the tile (0 is the most zoomed-out layer).
        schema:
          type: string
      - name: x
        in: path
        required: true
        description: The X coordinate of the tile (0 is the left side).
        schema:
          type: string
      - name: y
        in: path
        required: true
        description: The Y coordinate of the tile (0 is the top).
        schema:
          type: string
      - name: redirect
        in: query
        required: false
        description: If the tile exists as a complete file, allow an HTTP redirect instead of returning the data directly.  The redirect might not have the correct mime type.  "exact" must match the image encoding and quality parameters, "encoding" must match the image encoding but disregards quality, and "any" will redirect to any image if possible.
        schema:
          type: string
          enum:
          - 'false'
          - exact
          - encoding
          - any
          default: 'false'
      responses:
        '200':
          description: Success
        '400':
          description: ID was invalid.
        '403':
          description: Read access was denied for the item.
      summary: Get a large image tile.
      tags:
      - item
components:
  schemas:
    File:
      type: object
    string:
