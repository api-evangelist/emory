          description: Success
        '400':
          description: ID was invalid.
        '403':
          description: Read access was denied for the item.
      summary: Delete thumbnail and data files associated with a large_image item.
      tags:
      - item
    get:
      operationId: item_listTilesThumbnails_itemId_tiles_thumbnails
      parameters:
      - name: itemId
        in: path
        required: true
        description: The ID of the document.
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: ID was invalid.
