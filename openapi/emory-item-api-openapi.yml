  /item/{itemId}/tiles/histogram:
    get:
      description: This can take all of the parameters as the region endpoint, plus some histogram-specific parameters.  Only typically used parameters are listed.  The returned result is a list with one entry per channel (always one of L, LA, RGB, or RGBA colorspace).  Each entry has the histogram values, bin edges, minimum and maximum values for the channel, and number of samples (pixels) used in the computation.
      operationId: item_getHistogram_itemId_tiles_histogram
      parameters:
      - name: itemId
        in: path
        required: true
        description: The ID of the item.
        schema:
          type: string
      - name: width
        in: query
        required: false
        description: The maximum width of the analyzed region in pixels.
        schema:
          type: integer
          format: int32
          default: 2048
      - name: height
        in: query
        required: false
        description: The maximum height of the analyzed region in pixels.
        schema:
          type: integer
          format: int32
          default: 2048
      - name: resample
        in: query
        required: false
        description: If false, an existing level of the image is used for the histogram.  If true, the internal values are interpolated to match the specified size as needed.  0-3 for a specific interpolation method (0-nearest, 1-lanczos, 2-bilinear, 3-bicubic)
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
          - '0'
          - '1'
          - '2'
          - '3'
          default: 'false'
      - name: frame
        in: query
        required: false
        description: For multiframe images, the 0-based frame number.  This is ignored on non-multiframe images.
        schema:
          type: integer
          format: int32
      - name: bins
        in: query
        required: false
        description: The number of bins in the histogram.
        schema:
          type: integer
          format: int32
          default: 256
      - name: rangeMin
        in: query
        required: false
        description: The minimum value in the histogram.  Defaults to the minimum value in the image.
        schema:
          type: number
          format: float
      - name: rangeMax
        in: query
        required: false
        description: The maximum value in the histogram.  Defaults to the maximum value in the image.
        schema:
          type: number
          format: float
      - name: roundRange
        in: query
        required: false
        description: If true and neither a minimum or maximum is specified for the range, round the bin edges and adjust the number of bins for integer data with smaller ranges.
        schema:
          type: boolean
          default: false
      - name: density
        in: query
        required: false
        description: If true, scale the results by the number of samples.
        schema:
          type: boolean
          default: false
      - name: cache
        in: query
        required: false
        description: Report on or request caching the specified histogram for all frames.  Scheduling creates a local job.
        schema:
          type: string
          enum:
          - none
          - report
          - schedule
      responses:
        '200':
          description: Success
        '400':
          description: ID was invalid.
        '403':
          description: Read access was denied for the item.
      summary: Get a histogram for any region of a large image item.
      tags:
      - item
