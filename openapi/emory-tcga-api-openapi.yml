      parameters:
      - name: id
        in: path
        required: true
        description: The id of the case
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: A parameter was invalid.
      summary: List tables present inside case metadata
      tags:
      - tcga
  /tcga/case/{id}/metadata/{table}:
    delete:
      operationId: tcga_deleteCaseMetadata_delete_case_id_metadata_table
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the case
        schema:
          type: string
      - name: table
        in: path
        required: true
        description: The table to remove
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: A parameter was invalid.
      summary: Delete case metadata
      tags:
      - tcga
    get:
      operationId: tcga_getCaseMetadata_case_id_metadata_table
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the case
        schema:
          type: string
      - name: table
        in: path
        required: true
        description: The table name to get
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: A parameter was invalid.
      summary: Get case metadata
      tags:
      - tcga
    post:
      operationId: tcga_setCaseMetadata_post_case_id_metadata_table
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the case
        schema:
          type: string
      - name: table
        in: path
        required: true
        description: The table to update
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: A parameter was invalid.
      summary: Create or replace case metadata
      tags:
      - tcga
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/string'
        required: true
        description: A JSON object containing the metadata to create
    put:
      description: Set metadata fields to null to delete them.
      operationId: tcga_updateCaseMetadata_put_case_id_metadata_table
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the case
        schema:
          type: string
      - name: table
        in: path
        required: true
        description: The table to update
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: A parameter was invalid.
      summary: Update case metadata
      tags:
      - tcga
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/string'
        required: true
        description: A JSON object containing the metadata to update
