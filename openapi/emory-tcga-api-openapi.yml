openapi: 3.0.3
info:
  title: Girder REST API (Emory Digital Slide Archive) annotation tcga API
  version: 3.2.14
  description: OpenAPI 3.0 conversion of the Girder REST API powering the Emory Digital Slide Archive (computablebrain). Converted faithfully from the live Swagger 2.0 document at https://computablebrain.emory.edu/api/v1/describe.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt
servers:
- url: https://computablebrain.emory.edu/api/v1
tags:
- description: tcga resource
  name: tcga
paths:
  /tcga:
    delete:
      operationId: tcga_deleteCollection_delete_tcga
      responses:
        '200':
          description: Success
        '400':
          description: A parameter was invalid.
      summary: Remove the TCGA collection
      tags:
      - tcga
      parameters: []
    get:
      operationId: tcga_getCollection_tcga
      responses:
        '200':
          description: Success
        '400':
          description: A parameter was invalid.
      summary: Get the TCGA collection
      tags:
      - tcga
      parameters: []
    post:
      operationId: tcga_setCollection_post_tcga
      parameters:
      - name: collectionId
        in: query
        required: true
        description: The id of the collection
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: A parameter was invalid.
      summary: Set the TCGA collection
      tags:
      - tcga
  /tcga/aperio:
    post:
      operationId: tcga_importTCGADocument_post_aperio
      parameters:
      - name: id
        in: query
        required: true
        description: The id of the item or root to import
        schema:
          type: string
      - name: tag
        in: query
        required: false
        description: Import annotations with this tag
        schema:
          type: string
      - name: recursive
        in: query
        required: false
        description: Perform a recursive search for annotations
        schema:
          type: boolean
      responses:
        '200':
          description: Success
        '400':
          description: A parameter was invalid.
      summary: Import an item as an Aperio annotation
      tags:
      - tcga
  /tcga/case:
    get:
      operationId: tcga_findCase_case
      parameters:
      - name: cohort
        in: query
        required: true
        description: The id of the cohort document
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Result set size limit.
        schema:
          type: integer
          format: int32
          default: 50
      - name: offset
        in: query
        required: false
        description: Offset into result set.
        schema:
          type: integer
          format: int32
          default: 0
      - name: sort
        in: query
        required: false
        description: Field to sort the result set by.
        schema:
          type: string
          default: name
      - name: sortdir
        in: query
        required: false
        description: 'Sort order: 1 for ascending, -1 for descending.'
        schema:
          type: integer
          format: int32
          enum:
          - 1
          - -1
          default: 1
      responses:
        '200':
          description: Success
        '400':
          description: A parameter was invalid.
      summary: List cases in the TCGA dataset
      tags:
      - tcga
    post:
      operationId: tcga_importCase_post_case
      parameters:
      - name: folderId
        in: query
        required: true
        description: The id of the folder to import
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: A parameter was invalid.
      summary: Import a folder as a TCGA case
      tags:
      - tcga
  /tcga/case/label/{label}:
    get:
      operationId: tcga_getCaseByLabel_case_label_label
      parameters:
      - name: label
        in: path
        required: true
        description: The label of the case
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Label was invalid
      summary: Get a case document from a label
      tags:
      - tcga
  /tcga/case/search:
    get:
      description: Only one of "value" or "substring" may be provided.
      operationId: tcga_searchCase_case_search
      parameters:
      - name: table
        in: query
        required: true
        description: A table to search
        schema:
          type: string
      - name: key
        in: query
        required: false
        description: A key that should be present
        schema:
          type: string
      - name: value
        in: query
        required: false
        description: The value associated with the given key
        schema:
          type: string
      - name: substring
        in: query
        required: false
        description: Find values containing this substring
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Result set size limit.
        schema:
          type: integer
          format: int32
          default: 50
      - name: offset
        in: query
        required: false
        description: Offset into result set.
        schema:
          type: integer
          format: int32
          default: 0
      - name: sort
        in: query
        required: false
        description: Field to sort the result set by.
        schema:
          type: string
          default: name
      - name: sortdir
        in: query
        required: false
        description: 'Sort order: 1 for ascending, -1 for descending.'
        schema:
          type: integer
          format: int32
          enum:
          - 1
          - -1
          default: 1
      responses:
        '200':
          description: Success
        '400':
          description: A parameter was invalid.
      summary: Search for cases by clinical data
      tags:
      - tcga
  /tcga/case/{id}:
    delete:
      operationId: tcga_deleteCase_delete_case_id
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the case
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: A parameter was invalid.
      summary: Remove a case document
      tags:
      - tcga
    get:
      operationId: tcga_getCase_case_id
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the case
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: A parameter was invalid.
      summary: Get a case document from an id
      tags:
      - tcga
  /tcga/case/{id}/images:
